appId: com.enix.servermon
productName: ServerMon
directories:
  output: dist
files:
  - out/**/*
  - package.json
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}

# In-app updates read app-update.yml (generated by electron-builder) or the
# SERVERMON_UPDATE_URL environment variable at runtime. To enable updates,
# configure a publish provider here and upload the generated artifacts:
#
# publish:
#   provider: generic
#   url: https://updates.example.com/servermon
#
# A GitHub provider works too:
#
# publish:
#   provider: github
#   owner: your-org
#   repo: servermon
