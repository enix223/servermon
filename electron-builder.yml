appId: com.enix.servermon
productName: ServerMon
directories:
  output: dist
files:
  - out/**/*
  - package.json

mac:
  category: public.app-category.developer-tools
  # electron-updater installs updates from the zip; the dmg is for first installs.
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  category: Development
  target:
    - AppImage
  artifactName: ${productName}-${version}-${arch}.${ext}

# The GitHub publish provider is what electron-builder writes into the bundled
# app-update.yml, so the in-app updater (Settings -> Application updates) knows
# where to look for new versions. It does not publish anything on its own: a
# local `npm run dist` never uploads, and CI passes --publish never so the
# release workflow controls which assets are attached.
publish:
  provider: github
  owner: enix223
  repo: servermon
